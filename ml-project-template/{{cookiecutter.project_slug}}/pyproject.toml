[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
authors = [
  { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]
{% if cookiecutter.license == "MIT" -%}
license = { text = "MIT" }
{% elif cookiecutter.license == "Apache-2.0" -%}
license = { text = "Apache-2.0" }
{% elif cookiecutter.license == "BSD-3-Clause" -%}
license = { text = "BSD-3-Clause" }
{% endif -%}
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
    # Deep Learning
    "torch>=2.7.0",
    "torchvision>=0.16.0",
    "pytorch-lightning>=2.1.0",
    "torchmetrics>=1.0.0",
    "timm>=0.9.0",
    # Data Science
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Image Processing
    "pillow>=10.0.0",
    "albumentations>=1.3.0",
    # Utilities
    "rich>=13.0.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    {%- if cookiecutter.use_hydra == "yes" %}
    "hydra-core>=1.3.0",
    {%- endif %}
    {%- if cookiecutter.use_wandb == "yes" %}
    "wandb>=0.24.0",
    {%- endif %}
    {%- if cookiecutter.use_dvc == "yes" %}
    "dvc>=3.0.0",
    {%- endif %}
    {%- if cookiecutter.use_fastapi == "yes" %}
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.21",
    "httpx>=0.28.1",
    {%- endif %}
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "invoke>=2.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "bandit>=1.9.3",
]

# Platform-specific PyTorch configuration
# Linux/Windows: CUDA 12.8 | macOS: CPU-only

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.project_slug }}"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "requires_data: mark test as requiring actual data files (skipped in CI)",
    "slow: mark test as slow running",
]
addopts = "-v --tb=short"

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[project.scripts]
train = "{{ cookiecutter.project_slug }}.train:main"
{%- if cookiecutter.use_fastapi == "yes" %}
api = "{{ cookiecutter.project_slug }}.api:app"
{%- endif %}
